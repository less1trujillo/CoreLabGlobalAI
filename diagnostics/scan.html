<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostics Scan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      color: #00ffe0;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1rem;
      max-width: 600px;
      margin: auto;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    input[type="file"] {
      padding: 0.5rem;
      border-radius: 6px;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #444;
      margin-bottom: 1rem;
    }

    .button {
      background-color: #00ffe0;
      color: #0f0f0f;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-size: 1rem;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
      cursor: pointer;
    }

    .button:hover {
      transform: scale(1.05);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🧠 Diagnostics Scan</h1>
  <p>Upload any business asset (image, screenshot, document) to begin automated analysis. This module detects legal risks, UX flaws, and growth opportunities using free AI tools.</p>

  <input type="file" accept="image/*,.pdf,.docx" />
  <br />
  <button class="button">Start Analysis</button>

  <footer>
    Powered by Hugging Face, Google Vision, and ClipDrop — no login required.
  </footer>
</body>
</html>
